<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulcast Overlay</title>
  <!--
    Transparent caption overlay for OBS / vMix Browser Source (and any
    HTML-based streaming tool). No UI chrome — only burned-in subtitles.

    The page opens ONE WebSocket (lang=all) and renders a single bilingual
    caption unit (original + translation) with the SAME shared model and
    the SAME LiveCaption component as the audience page
    (see /static/captions.js and /static/live-caption.js).

    The session id can also come from the path: /overlay/<session-id>.

    Query params
    ------------
    session   Session id (also /overlay/<id>)      (default: stage-1)
    lang      original | es | en | pt | all — a single language shows one
              line; "all" shows dual                          (default: dual
              from the session config: original + its translation)
    langs     Explicit dual languages, e.g. "original,es"
    pos       bottom | top                       (default: bottom)
    align     center | left | right              (default: center)
    size      Base font size in px               (default: 36)
    hold      Seconds to keep a line visible     (default: 6)
    gap       Gap between dual lines in em       (default: 0.15)
    bg        Background alpha 0..1              (default: 0 = transparent bar)
    fg        Text color (CSS)                   (default: #ffffff, editable)
    accent    Secondary/translation line color    (default: #069ddb primary blue)
    radius    Border radius in px                (default: 8)
    maxchars  Wrap hint: max characters/line     (default: 64)
    badge     0 to hide the session/lang badge   (default: 0 for OBS)
    status    1 to show connection status pill   (default: 0)
    style     bar | clean                        (default: bar)
              clean = no background box (text + shadow only)
    edge      fade | solid                       (default: fade)
              fade = background dissolves on left/right (no side line)
              solid = classic hard-edged pill
  -->
  <style>
    :root {
      --fg: #ffffff;
      --accent: #069ddb;
      --bg-alpha: 0;
      --radius: 8px;
      --font-size: 36px;
      --gap: 0.15em;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden !important;
    }
    /* No side scrollbars / focus lines in OBS/vMix browser sources */
    html,
    body,
    #stage,
    #lines {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    #stage::-webkit-scrollbar,
    #lines::-webkit-scrollbar {
      width: 0 !important;
      height: 0 !important;
      display: none !important;
    }
    * {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    #stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 3vh 4vw;
      overflow: hidden;
    }
    #stage.pos-top {
      justify-content: flex-start;
      padding-top: 6vh;
    }

    #lines {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
      opacity: 0;
      transition: opacity 0.18s ease;
      overflow: hidden;
    }
    #lines.show {
      opacity: 1;
    }
    #stage.align-left #lines {
      align-items: flex-start;
    }
    #stage.align-right #lines {
      align-items: flex-end;
    }

    /*
      Shared LiveCaption component (same markup as the audience page).
      Only ONE current caption is rendered — it updates in place.
    */
    .lc {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      align-items: center;
      width: 100%;
      max-width: 100%;
    }
    #stage.align-left .lc {
      align-items: flex-start;
    }
    #stage.align-right .lc {
      align-items: flex-end;
    }
    /*
      Caption "bar": soft horizontal fade so there is NO hard vertical line
      at the left/right edges (common complaint on Browser Sources).
    */
    .lc-line {
      position: relative;
      margin: 0;
      max-width: min(96vw, 1480px);
      padding: 0.5em 1.4em;
      border-radius: calc(var(--radius) * 0.5);
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, var(--bg-alpha)) 4%,
        rgba(0, 0, 0, var(--bg-alpha)) 96%,
        rgba(0, 0, 0, 0) 100%
      );
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .lc-line[hidden] {
      display: none;
    }
    /* Optional hard pill (only when edge=solid) */
    body.edge-solid .lc-line {
      background: rgba(0, 0, 0, var(--bg-alpha));
      border-radius: var(--radius);
    }
    .lc-line--original .lc-text {
      color: var(--fg);
      font-size: var(--font-size);
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      text-shadow:
        0 0 4px rgba(0, 0, 0, 0.75),
        0 1px 2px rgba(0, 0, 0, 0.7);
    }
    .lc-line--translation .lc-text {
      color: var(--accent);
      font-size: calc(var(--font-size) * 0.92);
      font-weight: 500;
      line-height: 1.35;
      text-align: center;
      text-shadow:
        0 0 4px rgba(0, 0, 0, 0.75),
        0 1px 2px rgba(0, 0, 0, 0.7);
    }
    .lc-box--overlay[data-interim="1"] .lc-text {
      opacity: 0.7;
    }
    .lc-line--translation[data-pending="1"] .lc-text {
      opacity: 0.55;
    }

    /* clean style: no box, just legible text */
    body.style-clean .lc-line {
      background: transparent;
      padding: 0.1em 0.2em;
    }
    body.style-clean .lc-line .lc-text {
      text-shadow:
        0 0 4px rgba(0, 0, 0, 0.9),
        0 1px 2px rgba(0, 0, 0, 0.9),
        0 0 18px rgba(0, 0, 0, 0.55);
    }

    /* Screen-reader-only labels (Original: / Traducción:). */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }

    #badge {
      position: absolute;
      top: 14px;
      left: 14px;
      font:
        600 13px/1 system-ui,
        sans-serif;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.45);
      padding: 7px 12px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      display: none;
      box-shadow: none;
      border: none;
    }
    #badge.show {
      display: inline-block;
    }

    #status {
      position: absolute;
      top: 14px;
      right: 14px;
      font:
        600 12px/1 system-ui,
        sans-serif;
      padding: 7px 12px;
      border-radius: 999px;
      display: none;
      background: rgba(0, 0, 0, 0.45);
      color: #fbbf24;
      border: none;
      box-shadow: none;
    }
    #status.show {
      display: inline-block;
    }
    #status.ok {
      color: #4ade80;
    }
    #status.err {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div id="badge">CC</div>
  <div id="status">…</div>
  <div id="stage" class="pos-bottom align-center">
    <div id="lines" aria-live="polite">
      <div class="lc-box lc-box--overlay" id="overlayCaption"></div>
    </div>
  </div>

  <script src="/static/captions.js"></script>
  <script src="/static/live-caption.js"></script>
  <script src="/static/overlay.js"></script>
</body>
</html>
